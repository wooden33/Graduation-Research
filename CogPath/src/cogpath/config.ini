; CogPath single-subject configuration.
;
; This file is for ad-hoc runs and debugging.  For experiments (ablations,
; model sweeps) use the manifest-driven runner instead:
;
;     cd evaluation
;     python experiment.py resolve --study experiments/studies/rq2_ablation.yaml \
;         --variant w_o_cs_bs --model qwen3-coder:30b-a3b-q8_0
;     python experiment.py run --study experiments/studies/rq2_ablation.yaml
;
; The runner never edits this file; it writes a per-class config into the run
; directory and passes it with --config.  See evaluation/experiments/README.md.
;
; NOTE: `use_constraints`, `use_backward_slice` and `fix_type` are the ablation
; factors.  They are REQUIRED and must be stated explicitly -- CogPath refuses to
; start without them, because a missing factor used to be inherited silently
; from whatever the previous run left behind.

[default]
; ---- subject ---------------------------------------------------------------
project_directory = defects4j-subjects-notests/JacksonXml-5f
source_code_file = defects4j-subjects-notests/JacksonXml-5f/src/main/java/com/fasterxml/jackson/dataformat/xml/ser/ToXmlGenerator.java
test_code_file = defects4j-subjects-notests/JacksonXml-5f/src/test/java/com/fasterxml/jackson/dataformat/xml/ser/ToXmlGeneratorTest.java
test_file_output_path =
code_coverage_report_path = defects4j-subjects-notests/JacksonXml-5f/target/jacoco/jacoco.csv
test_execution_command = mvn clean package -Dtest=ToXmlGeneratorTest
test_dependency_command = mvn dependency:list -DexcludeTransitive=true | grep ":test"
test_code_command_dir = defects4j-subjects-notests/JacksonXml-5f
included_files =
junit_version = 4

; ---- model -----------------------------------------------------------------
; Any litellm model id.  Use `solver_model` to give Constraint-Hints its own
; model; leave it empty to reuse `model`.
model = deepseek-v4.1-flash
solver_model =

; ---- coverage / reporting --------------------------------------------------
coverage_type = jacoco
report_filepath = ToXmlGenerator_control_test_results.html

; ---- loop budget -----------------------------------------------------------
target_coverage = 100
maximum_iterations = 1
no_coverage_increase_iterations = 3
enable_fixing = 0

; ---- baseline selectors (normally both false) ------------------------------
run_symprompt = false
run_hits = false
max_slices_per_method = 5

; ---- prompt strategy -------------------------------------------------------
; control   -> CFG path selection (+ Constraint-Hints when enabled)
; coverage  -> prompt built from the coverage report
; baseline  -> plain generation prompt
prompt_type = control
pick_two_paths = true
additional_instructions =

; ---- ablation factors (REQUIRED, must be explicit) -------------------------
; use_constraints    : enable Constraint-Hints (CS)
; use_backward_slice : enable Backward Slicing (BS)
; fix_type           : "" = traditional repair, "MCTS" = alternative repair
;                      prompt (there is no MCTS search; the name is legacy)
;
;   full CogPath     : use_constraints=true   use_backward_slice=true   fix_type=
;   w/o CS           : use_constraints=false  use_backward_slice=true   fix_type=
;   w/o BS           : use_constraints=true   use_backward_slice=false  fix_type=
;   w/o CS+BS (base) : use_constraints=false  use_backward_slice=false  fix_type=
;
; If Constraint-Hints is enabled, pick_two_paths must stay true: the solver is
; only invoked for the second candidate path.
use_constraints = true
use_backward_slice = true
fix_type =
