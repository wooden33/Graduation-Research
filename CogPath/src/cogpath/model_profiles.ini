; Shareable model profiles. Section names are aliases used in config.ini and CLI.
; Use model for the provider/model identifier passed to LiteLLM.
; Put literal credentials in the ignored model_profiles.local.ini file, or set
; api_key_env here to read the credential from an environment variable.

[deepseek-v4.1-flash]
model = openai/deepseek-flash
api_base = https://api.deepseek.com
api_key_env = DEEPSEEK_API_KEY
litellm_params = {"extra_body": {"thinking": {"type": "disabled"}}}
